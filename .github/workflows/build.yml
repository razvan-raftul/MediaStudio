name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilare
        run: dotnet build MediaStudio.csproj -c Release -o out
      - name: Program de instalare
        shell: pwsh
        run: |
          try { Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Romanian.isl" -OutFile Romanian.isl } catch { Write-Host "Fara traducere romana" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publicare
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          Compress-Archive -Path out\MediaStudio.exe,out\MediaStudio.exe.config -DestinationPath MediaStudio.zip -Force
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest MediaStudio.zip MediaStudio-Setup.exe --title "Media Studio" --notes "Versiune compilata automat. MediaStudio-Setup.exe instaleaza programul si pune scurtatura pe desktop; MediaStudio.zip e varianta portabila."
